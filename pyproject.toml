[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-booking-agent"
version = "0.1.0"
description = "Safe MTProto restaurant-booking agent"
requires-python = ">=3.11"
dependencies = ["telethon>=1.36,<2", "httpx>=0.27,<1", "python-dotenv>=1.0,<2", "aiogram>=3.13,<4", "qrcode[pil]>=8,<9", "keyring>=25,<26"]

[project.optional-dependencies]
voice = ["imageio-ffmpeg>=0.6,<1"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]
